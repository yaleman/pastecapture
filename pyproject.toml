[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pastecapture"
version = "0.1.0"
description = "Silent clipboard and drop capture service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.31",
    "uuid6>=2025.0.1",
    "uvicorn>=0.42.0",
]

[project.scripts]
pastecapture = "pastecapture.cli:main"
pastecapture-openapi = "pastecapture.generate_openapi:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["pastecapture"]
