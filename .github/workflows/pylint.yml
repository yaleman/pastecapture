---
name: pylint

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  pylint: # don't rename, used in rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # c2a87611a18de5b3828c5652fe268e992400cb5c
      - name: Running linting
        run: mise run ruff
